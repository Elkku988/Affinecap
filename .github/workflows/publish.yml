name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  metadata:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate tag syntax
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must have the form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run tests
        run: python -m pytest

      - name: Run examples
        run: |
          python examples/minimal.py
          python examples/deployment_approval.py

  build-and-test:
    name: Build and test tagged source
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.metadata.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag, commit, and version agreement
        shell: bash
        env:
          EXPECTED_TAG: ${{ needs.metadata.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "refs/tags/$EXPECTED_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Checked-out commit does not match $EXPECTED_TAG." >&2
            exit 1
          fi

          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          expected = os.environ["EXPECTED_VERSION"]
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          project_version = pyproject["project"]["version"]
          init_text = pathlib.Path("src/affinecap/__init__.py").read_text()
          match = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']\s*$',
              init_text,
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit("src/affinecap/__init__.py has no literal __version__")
          package_version = match.group(1)
          versions = {
              "release tag": expected,
              "pyproject.toml": project_version,
              "affinecap.__version__": package_version,
          }
          if len(set(versions.values())) != 1:
              details = ", ".join(f"{key}={value!r}" for key, value in versions.items())
              raise SystemExit(f"Release version mismatch: {details}")
          PY

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type-check
        run: python -m mypy

      - name: Run examples
        run: |
          python examples/minimal.py
          python examples/deployment_approval.py

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify the distribution set
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t distributions < <(
            find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort
          )
          expected=(
            "affinecap-$EXPECTED_VERSION-py3-none-any.whl"
            "affinecap-$EXPECTED_VERSION.tar.gz"
          )
          if [[ "${distributions[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected distribution set:" >&2
            printf '  %s\n' "${distributions[@]}" >&2
            exit 1
          fi

      - name: Smoke-test built wheel
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/affinecap-release-smoke"
          "$RUNNER_TEMP/affinecap-release-smoke/bin/python" \
            -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/affinecap-release-smoke/bin/python" -c \
            'import os, affinecap; assert affinecap.__version__ == os.environ["EXPECTED_VERSION"]'

      - name: Upload distributions for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish-pypi:
    name: Publish to PyPI
    needs: [metadata, compatibility, build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/affinecap
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fail closed on conflicting PyPI files
        id: preflight
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          version = os.environ["EXPECTED_VERSION"]
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in pathlib.Path("dist").iterdir()
              if path.is_file()
          }
          url = f"https://pypi.org/pypi/affinecap/{version}/json"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "affinecap-release-preflight/1"},
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              remote = {}
          else:
              remote = {
                  item["filename"]: item["digests"]["sha256"]
                  for item in data["urls"]
              }

          conflicts = {
              filename: digest
              for filename, digest in remote.items()
              if local.get(filename) != digest
          }
          if conflicts:
              raise SystemExit(
                  "PyPI already contains unexpected or different files for "
                  f"affinecap {version}: {conflicts!r}"
              )

          upload_required = remote != local
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"upload_required={str(upload_required).lower()}", file=output)
          if upload_required:
              print(f"PyPI has {len(remote)} of {len(local)} matching files.")
          else:
              print("PyPI already has the exact distribution set; upload is complete.")
          PY

      - name: Publish distributions with Trusted Publishing
        if: steps.preflight.outputs.upload_required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true
          # A partial upload can leave one immutable matching file. Re-run only
          # failed jobs so this workflow's retained build artifact is reused.
          skip-existing: true

  verify-pypi:
    name: Verify published artifacts
    needs: [metadata, build-and-test, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Match PyPI files to local SHA-256 hashes
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import time
          import urllib.error
          import urllib.request

          version = os.environ["EXPECTED_VERSION"]
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in pathlib.Path("dist").iterdir()
              if path.is_file()
          }
          url = f"https://pypi.org/pypi/affinecap/{version}/json"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "affinecap-release-verifier/1"},
          )

          data = None
          for delay in (0, 2, 4, 8, 10, 10):
              if delay:
                  time.sleep(delay)
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      data = json.load(response)
                  break
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError):
                  continue
          if data is None:
              raise SystemExit(f"PyPI did not expose affinecap {version} in time")

          remote = {
              item["filename"]: item["digests"]["sha256"]
              for item in data["urls"]
          }
          if remote != local:
              raise SystemExit(
                  "PyPI artifact set or SHA-256 hashes differ from this build: "
                  f"local={local!r}, remote={remote!r}"
              )
          print(f"Verified {len(local)} affinecap {version} artifacts on PyPI.")
          PY

  publish-github:
    name: Create GitHub Release
    needs: [metadata, build-and-test, verify-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          publish_draft=false
          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_prerelease="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
            if [[ "$is_prerelease" == "true" ]]; then
              echo "Existing stable-version release is marked as a prerelease." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            is_draft="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" == "true" ]]; then
              publish_draft=true
            fi
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Affinecap $RELEASE_VERSION" \
              --generate-notes
            publish_draft=true
          fi

          mapfile -t release_assets < <(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' | LC_ALL=C sort
          )
          expected_assets=(
            "affinecap-$RELEASE_VERSION-py3-none-any.whl"
            "affinecap-$RELEASE_VERSION.tar.gz"
          )
          if [[ "${release_assets[*]}" != "${expected_assets[*]}" ]]; then
            echo "Unexpected GitHub Release asset set:" >&2
            printf '  %s\n' "${release_assets[@]}" >&2
            exit 1
          fi

          if [[ "$publish_draft" == "true" ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --draft=false
          fi
